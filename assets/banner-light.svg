<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Claude Prospector">
  <defs>
    <pattern id="grid-l" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#211B15" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="#F7F1E7"/>
  <rect width="1200" height="320" fill="url(#grid-l)"/>

  <!-- atmosphere echo, bleeding off the right edge -->
  <g opacity="0.08" stroke="#211B15" fill="none">
    <circle cx="1080" cy="160" r="110" stroke-width="2"/>
    <circle cx="1080" cy="160" r="160" stroke-width="2"/>
    <circle cx="1080" cy="160" r="210" stroke-width="2"/>
    <line x1="1080" y1="-10" x2="1080" y2="330" stroke-width="1.5"/>
    <line x1="850" y1="160" x2="1200" y2="160" stroke-width="1.5"/>
  </g>
  <circle cx="1155" cy="78" r="9" fill="#C65D3B" opacity="0.2"/>

  <!-- logo mark -->
  <g transform="translate(80,110)">
    <circle cx="50" cy="50" r="28" fill="none" stroke="#211B15" stroke-width="4"/>
    <g stroke="#211B15" stroke-width="4" stroke-linecap="round">
      <line x1="50" y1="22" x2="50" y2="15"/>
      <line x1="50" y1="78" x2="50" y2="85"/>
      <line x1="78" y1="50" x2="85" y2="50"/>
      <line x1="22" y1="50" x2="15" y2="50"/>
    </g>
    <g fill="#F7F1E7" stroke="#211B15" stroke-width="2.4">
      <circle cx="38" cy="36" r="3.2"/>
      <circle cx="64" cy="40" r="3.2"/>
      <circle cx="58" cy="66" r="3.2"/>
    </g>
    <line x1="50" y1="50" x2="36" y2="63" stroke="#C65D3B" stroke-width="2.6" opacity="0.9"/>
    <circle cx="36" cy="63" r="5.6" fill="#C65D3B" stroke="#F7F1E7" stroke-width="1.6"/>
  </g>

  <!-- wordmark -->
  <text x="204" y="152" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="54" font-weight="800" fill="#211B15" letter-spacing="-0.5">Claude Prospector</text>
  <text x="204" y="186" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#211B15" fill-opacity="0.72">Find the right companies. Write the mail yourself.</text>

  <!-- chip -->
  <rect x="204" y="206" width="176" height="30" rx="15" fill="none" stroke="#C65D3B" stroke-width="1.5"/>
  <text x="292" y="226" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#C65D3B" text-anchor="middle">FOR CLAUDE CODE</text>

  <!-- footer rule -->
  <line x1="80" y1="280" x2="1120" y2="280" stroke="#211B15" stroke-opacity="0.15" stroke-width="1"/>
  <text x="80" y="300" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#211B15" fill-opacity="0.45">MIT licensed &#183; research only, never sends outreach</text>
  <text x="1120" y="300" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#211B15" fill-opacity="0.45" text-anchor="end">github.com/pramodkrishnaa/claude-prospector</text>
</svg>
